<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periyodik Tablo Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="gameScreen">
        <h1>🧪 Periyodik Tablo Oyunu</h1>
        <div id="score">Doğru: 0</div>
        <div id="questionCount">Soru: 0 / 20</div>
        <div class="question" id="question"></div>
        <div class="choices" id="choices"></div>
        <div id="result"></div>
    </div>

    <div id="endScreen">
        <div class="bigText" id="finalMessage"></div>
        <div id="finalScore"></div>
        <div class="endButtons">
            <button onclick="restartGame()">🔄 Tekrar Oyna</button>
            <button onclick="closeGame()">❌ Oyunu Kapat</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
